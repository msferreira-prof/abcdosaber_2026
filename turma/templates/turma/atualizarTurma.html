{% extends "base_template.html" %}

{% block title %}
    <title>AbcDoSaber - Turma</title>
{% endblock %}

{% block menu %}
    <div class="collapse navbar-collapse justify-content-end" id="mynavbar">
        <div class="navbar-nav">
            <a href="/" class="nav-link">Início</a>
            <a href="{% url 'turma:cadastro' %}" class="nav-link">Cadastrar</a>
            <a href="{% url 'turma:listar' %}" class="nav-link">Listar</a>            
            <a href="#" class="nav-link">Registrar Ausência</a>
        </div>
    </div>
{% endblock %}

{% block titulo_pagina %}
{% endblock %}

{% block corpo %}
    <main class="container m-2 w-75 mx-auto my-font-family">

        <div class="row">
            <div class="col text-center m-0">
                <h2 class="mt-2 mb-5 my-h2">Atualização de Turma</h2>
            </div>
        </div>

        <!-- formulario HTML -->
        <form name="frmCadastrarTurma" action="{% url 'turma:atualizar_turma' %}" method="post" class="my-label-color-purple">

            {% csrf_token %}

            <div class="form-group">
                <label for="idNumero" class="col-form-label">Turma</label>
                <input class="form-control" type="text" id="idNumero" name="numero" required value="{{ turma.numero }}" readonly>
            </div>

            <div class="form-group">
                <label for="idHorarioAula" class="col-form-label">Horário da Aula</label>
                <input class="form-control" type="time" id="idHorarioAula" name="horario_aula" required value="{{ turma.horario_aula }}">
            </div>

            <div class="form-group">
                <label for='idDuracaoAula'>Duração da Aula em horas</label>
                <input class="form-control" type='number' id='idDuracaoAula' name='duracao_aula' required value="{{ turma.duracao_aula }}">
            </div>

            <div class="form-group">
                <label for='idDataInicial'>Data de Início</label>
                <input class="form-control" type='date' id='idDataInicial' name='data_inicial' required value='{{ turma.data_inicial|date:"Y-m-d" }}'>
            </div>

            <div class="form-group">
                <label for='idDataFinal'>Data de Fim</label>
                <input class="form-control" type='date' id='idDataFinal' name='data_final' value='{{ turma.data_final|date:"Y-m-d" }}'>
            </div>

            <!-- montagem do combo com os tipos de atividade -->
            <div class="form-group">
                <label for="idTipoAtividade">Tipo de Atividade</label>
                <select class="form-control" id="idTipoAtividade" name="codigo_atividade">
                    <option value="0">Selecione...</option>
                    {% for atividade in tiposdeatividade %}
                        {% if atividade.codigo == turma.codigo_atividade.codigo %}
                            <option value="{{atividade.codigo}}" selected>{{atividade.descricao}}</option>
                        {% else %}                        
                            <option value="{{atividade.codigo}}">{{atividade.descricao}}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>


            <!-- montagem do combo com os instrutores -->
            <div class="form-group">
                <label for="idInstrutor">Instrutor</label>
                <select class="form-control" id="idInstrutor" name="id_instrutor">
                    <option value="0">Selecione...</option>
                    {% for instrutor in instrutores %}
                        {% if instrutor.id == turma.id_instrutor.id %}
                            <option value="{{ instrutor.id }}" selected>{{ instrutor.nome }}</option>
                        {% else %}
                            <option value="{{ instrutor.id }}">{{ instrutor.nome }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <!-- montagem do combo com os alunos -->
            <div class="form-group">
                <label for="idAluno">Aluno Monitor</label>
                <select class="form-control" id="idAluno" name="matricula_monitor">
                    <option value="0">Selecione...</option>
                    {% for aluno in alunos %}
                        {% if aluno.matricula == turma.matricula_monitor.matricula %}
                            <option value="{{ aluno.matricula }}" selected>{{ aluno.nome }}</option>
                        {% else %}
                            <option value="{{ aluno.matricula }}">{{ aluno.nome }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="form-group my-4 text-center">
                <input type="reset" value="Limpar" class="btn btn-primary btn-md">
                <input type="submit" value="Atualizar" class="btn btn-primary btn-md">
            </div>

        </form>

    </main>
{% endblock %}
